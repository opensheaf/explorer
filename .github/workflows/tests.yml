name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: pip install -r requirements-literate.txt
      - name: the files are tangled from literate/
        run: literate tangle --check
      - name: the tests of the modules, against the fixture archives
        run: node --test tests/*.test.mjs
  weave:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-literate.txt
      - run: literate weave --branch "${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        with:
          name: literate-site
          path: site
