name: pages
# Publish the explorer (index.html, app/, style.css, embed.js, schemas/, the
# symbol) and, under source/, its literate program woven into a website,
# with GitHub Pages: https://opensheaf.org/explorer/
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-literate.txt
      - name: the files are tangled from literate/
        run: literate tangle --check
      - name: the application
        run: |
          mkdir -p site
          cp -R index.html app style.css embed.js schemas opensheaf-symbol.svg LICENSE site/
      - name: the literate program
        run: literate weave --branch main
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
